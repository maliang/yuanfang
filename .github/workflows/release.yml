name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and publish (e.g. v0.2.0)"
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  macos-arm64:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Resolve release tag
        id: tag
        run: |
          TAG="${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Release tag: $TAG"

      - name: Check app version matches tag
        run: |
          APP_VERSION="$(node -p "require('./apps/desktop/package.json').version")"
          TAG="${{ steps.tag.outputs.tag }}"
          if [ "v$APP_VERSION" != "$TAG" ]; then
            echo "apps/desktop/package.json version is $APP_VERSION, but tag is $TAG" >&2
            echo "Bump apps/desktop/package.json before tagging." >&2
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Typecheck and smoke
        run: |
          npm run typecheck
          npm run smoke

      - name: Build app and release assets
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          npm run build
          cd apps/desktop
          npx electron-builder --mac --arm64 --publish never

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: 元芳 ${{ steps.tag.outputs.tag }}
          generate_release_notes: true
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          files: |
            apps/desktop/dist/*.dmg
            apps/desktop/dist/*.zip
            apps/desktop/dist/latest-mac.yml

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: yuanfang-macos-arm64
          path: |
            apps/desktop/dist/*.dmg
            apps/desktop/dist/*.zip
            apps/desktop/dist/latest-mac.yml
          if-no-files-found: error
