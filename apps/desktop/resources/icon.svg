<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="96" y1="64" x2="928" y2="960" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#20294d"/>
      <stop offset="0.46" stop-color="#10152a"/>
      <stop offset="1" stop-color="#070a12"/>
    </linearGradient>
    <radialGradient id="halo" cx="0" cy="0" r="1" gradientTransform="translate(420 300) rotate(48) scale(520)">
      <stop offset="0" stop-color="#7c8cff" stop-opacity="0.34"/>
      <stop offset="0.55" stop-color="#5566e8" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#5566e8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="warm" cx="0" cy="0" r="1" gradientTransform="translate(786 314) rotate(90) scale(230)">
      <stop offset="0" stop-color="#f2b36a" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#f2b36a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="arc" x1="226" y1="218" x2="806" y2="774" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8f9cff"/>
      <stop offset="0.52" stop-color="#6f7df2"/>
      <stop offset="1" stop-color="#4fc3a1"/>
    </linearGradient>
    <linearGradient id="mark" x1="350" y1="300" x2="688" y2="752" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.52" stop-color="#eef1ff"/>
      <stop offset="1" stop-color="#cbd5ff"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="0.45" stop-color="#ffffff" stop-opacity="0.02"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="markShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="22" stdDeviation="24" flood-color="#02040a" flood-opacity="0.62"/>
    </filter>
    <filter id="arcGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="dotGlow" x="-300%" y="-300%" width="700%" height="700%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1024" height="1024" rx="232" fill="url(#bg)"/>
  <rect x="1" y="1" width="1022" height="1022" rx="231" fill="none" stroke="#ffffff" stroke-opacity="0.10" stroke-width="2"/>
  <rect x="30" y="30" width="964" height="964" rx="208" fill="none" stroke="#ffffff" stroke-opacity="0.035" stroke-width="2"/>

  <ellipse cx="430" cy="300" rx="470" ry="380" fill="url(#halo)"/>
  <ellipse cx="800" cy="310" rx="220" ry="230" fill="url(#warm)"/>
  <path d="M76 256C180 118 314 66 474 58L1024 0V300C760 280 418 246 76 256Z" fill="url(#shine)"/>

  <circle cx="512" cy="512" r="350" fill="none" stroke="#ffffff" stroke-opacity="0.075" stroke-width="3"/>
  <circle cx="512" cy="512" r="286" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="2"/>
  <circle cx="512" cy="512" r="403" fill="none" stroke="#ffffff" stroke-opacity="0.028" stroke-width="2"/>

  <path d="M512 162A350 350 0 1 1 167 573" fill="none" stroke="url(#arc)" stroke-width="12" stroke-linecap="round" filter="url(#arcGlow)" opacity="0.92"/>

  <g filter="url(#dotGlow)">
    <circle cx="799" cy="311" r="14" fill="#f2b36a"/>
  </g>
  <circle cx="799" cy="311" r="26" fill="none" stroke="#f2b36a" stroke-opacity="0.22" stroke-width="2"/>

  <g filter="url(#markShadow)">
    <path d="M512 548L388 344" fill="none" stroke="url(#mark)" stroke-width="74" stroke-linecap="round"/>
    <path d="M512 548L636 344" fill="none" stroke="url(#mark)" stroke-width="74" stroke-linecap="round"/>
    <path d="M512 548L512 736" fill="none" stroke="url(#mark)" stroke-width="74" stroke-linecap="round"/>
  </g>
  <path d="M512 548L398 360" fill="none" stroke="#ffffff" stroke-opacity="0.34" stroke-width="6" stroke-linecap="round"/>
  <path d="M512 548L512 718" fill="none" stroke="#ffffff" stroke-opacity="0.22" stroke-width="6" stroke-linecap="round"/>

